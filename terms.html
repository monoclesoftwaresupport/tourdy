<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>투어디 이용약관</title>
<meta name="description" content="투어디(TOURDY) 이용약관">
<link rel="icon" type="image/png" href="favicon-64.png">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#16202e;--muted:#5b6675;--line:#e3e7ec;--accent:#1d6fd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101014;--surface:#1a1b20;--ink:#eef1f6;--muted:#9aa3b2;--line:#2b2d35;--accent:#5b9bff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px clamp(18px,4vw,36px)}
.brand{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em}
h1{font-size:26px;margin:4px 0 18px;letter-spacing:-.02em}
h3{font-size:16px;margin:26px 0 6px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
p,div{overflow-wrap:anywhere}
.lg-table{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;min-width:560px;font-size:13px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--accent) 8%,transparent)}
nav{max-width:720px;margin:14px auto 0;font-size:13px;color:var(--muted);text-align:center}nav a{color:var(--accent)}
</style>
</head>
<body>
<main><div class="brand">TOURDY · 투어디</div><h1>이용약관</h1><div id="doc"></div></main>
<nav><a href="privacy.html">개인정보 처리방침</a> · <a href="./">투어디 열기</a></nav>
<script src="js/legal.js"></script>
<script>document.getElementById('doc').innerHTML=legalHTML('terms')</script>
</body>
</html>
